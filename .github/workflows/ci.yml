name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit and integration tests (chip-backed tests skip without TRIAD_CHIP)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
